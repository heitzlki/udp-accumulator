# APIO project configuration.
# https://fpgawars.github.io/apio/docs/project-file

# -flatten is required: nextpnr-xilinx resolves module hierarchy itself and
# gets it wrong for modules nested two or more levels deep - the design
# passes RTL and post-synthesis simulation but misbehaves on the chip.
# Flattening in yosys hands nextpnr a single module and avoids the problem.

[env:default]
board = pynq-z2
top-module = main
yosys-extra-options = -flatten

# Loopback smoke build: GEM1 TX wired straight back to its RX, no MAC in
# between. Proves the clock topology and SLCR setup with ~10 lines of logic.
# Build with: apio build --env loopback
[env:loopback]
board = pynq-z2
top-module = main
defines = ACC_LOOPBACK
yosys-extra-options = -flatten
